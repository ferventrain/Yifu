<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yifu Pipeline Monitor (PM)</title>
  <link rel="stylesheet" href="/styles.css?v=5" />
</head>
<body>
  <header class="app-header">
    <div class="brand">
      <h1>Yifu Pipeline Monitor <span class="pm-abbr">(PM)</span></h1>
      <p class="subtitle" id="header-paths">Loading…</p>
    </div>
    <div class="header-meta">
      <span id="runner-status" class="header-status">读取中</span>
    </div>
  </header>

  <main>
    <section class="mode-panel">
      <div class="legend">
        <span><i class="lamp queued"></i>等待</span>
        <span><i class="lamp running"></i>运行中</span>
        <span><i class="lamp verifying"></i>验证输出</span>
        <span><i class="lamp succeeded"></i>完成</span>
        <span><i class="lamp failed"></i>失败</span>
        <span><i class="lamp stalled"></i>失联</span>
      </div>
      <div class="toolbar">
        <form id="add-form" class="add-form">
          <label>
            样本目录
            <input id="sample-dir" type="text" required placeholder="S:\Arivis_Analysis\sample_name" />
          </label>
          <label>
            config.json
            <input id="config-path" type="text" placeholder="留空则使用 样本目录\config.json" />
          </label>
          <button type="submit" class="btn primary">提交任务</button>
        </form>
      </div>
      <p class="hint">提交命令：<code>python -m pipeline_modules.harness run --sample-dir &lt;样本目录&gt;</code>。本页面只读：刷新不会启动任何任务。</p>
      <p id="form-error" class="error-banner hidden"></p>
      <div id="job-list" class="job-list"></div>
    </section>
  </main>

  <dialog id="log-dialog" class="log-dialog">
    <div class="log-head">
      <strong id="log-title">日志</strong>
      <button type="button" id="log-close" class="btn">关闭</button>
    </div>
    <pre id="log-body" class="log-body"></pre>
  </dialog>

  <script src="/app.js?v=5"></script>
</body>
</html>
